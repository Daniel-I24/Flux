# Build performance (sized for a laptop with limited RAM).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1536m
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# App version shared by the phone and the watch (Data Layer requires matching apps).
flux.versionCode=1
flux.versionName=1.0.0

# KSP2 (2.2.20-2.0.3) fails to resolve classes coming from the pure Kotlin/JVM modules
# when generating Hilt code in :mobile; KSP1 resolves them correctly (see DECISIONS.md N-018).
ksp.useKSP2=false
