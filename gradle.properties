# Build performance (sized for a laptop with limited RAM).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1536m
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# App version shared by the phone and the watch (Data Layer requires matching apps).
flux.versionCode=1
flux.versionName=1.0.0
