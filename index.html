<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090b11" />
    <meta name="description" content="FLUX: captura de notas por voz en tu reloj, clasificadas con IA y sincronizadas con tu celular." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FLUX</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('flux.theme');
        var dark = saved ? saved === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>FLUX necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
