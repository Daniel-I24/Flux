# Overrides on top of detekt's default configuration (buildUponDefaultConfig = true).
build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    ignorePrivate: true
  CyclomaticComplexMethod:
    threshold: 15
    ignoreSimpleWhenEntries: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
    excludes: ['**/test/**', '**/designsystem/**', '**/*Theme.kt', '**/*Tokens.kt', '**/*Preview*.kt', '**/core/model/**']
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
    excludeGuardClauses: true
    excludeReturnFromLambda: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    active: false
  WildcardImport:
    excludeImports: []
